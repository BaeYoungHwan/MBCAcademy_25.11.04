<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<style type="text/css">
*{
	margin: 0 auto;
	text-align: center;
	width: 1000px;
	height: 800px;
}

header#top{
	width: 1000px;
	height: 120px;
	color: white;
	background-color: #cccccc;
}

nav{
	width: 1000px;
	height: 40px;
	background-color: red;
}

aside{
	width: 200px;
	height: 400px;
	background-color: orange;
	float: left;
}

section{
	width: 800px;
	height: 400px;
	background: #00ff00;
	float: left;
}

header{
	width: 700px;
	height: 100px;
	background-color: #eeeeee;
}

article{
	width: 700px;
	height: 250px;
	background-color: gray;
}

footer{
	width: 1000px;
	height: 120px;
	color: white;
	background-color: #cccccc;
	float: left;
}

</style>


</head>
<body>

<!-- 
		Semantic : 의미있는
			Tag
			
		header		헤더(광고, 이미지..)
		
		nav			메뉴 및 목차(nav-bar)
		
		main
			(header) 
			
			section		주제별로 그룹화
			
			article		본문제 주내용이 들어 가는 공간(== main)
				
			aside		사이트메뉴, 광고
		
		footer		끝부분(회사설명, 회원관리, 미니메뉴)
 -->
 
<header id="top">header(top)</header>	<!-- == div --> 

<nav>nav</nav>

<section>section
	<header>제목</header>

	<article>article</article>
</section>

<aside>aside</aside>

<footer>footer</footer>


</body>
</html>
