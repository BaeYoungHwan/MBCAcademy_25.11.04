<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<style type="text/css">
*{
	margin: 0;
	padding: 0;
}

header, main, footer{
	width: 1100px;
	margin: 0 auto;
}
header{
	background-color: #d4f4fa;
	margin-top: 30px;
	padding: 20px;
}

main{
	background-color: #eaeaea;
	min-height: 500px;
	padding: 20px;
}

main article{
	background-color: #fff;
	margin-top: 10px;
	padding: 20px;
}

main aside{
	border: 1px solid #333;
	padding: 20px;
	margin-top: 10px;
	height: 140px;
}

footer{
	background-color: #c7c6ff;
	padding: 20px;
	margin-bottom: 10px;
}

#arti{
	width: 65%;
	margin-bottom: 10px;
	float: left;
}

#asi{
	width: 30%;
	float: right;	
} 

</style>


</head>
<body>

<header>header</header>

<main>
	<h2>main 화면입니다</h2>
	
	<div id="arti">
		<article>
			<h3>header</h3>			
			<p>머릿글</p>		
		</article>
		
		<article>
			<h3>nav</h3>
			<p>외부링크 모음</p>
		</article>
	</div>
	
	<aside id="asi">
		<h3>aside</h3>
		<p>사이드바 태그</p>
	</aside>
	
	<article style="clear: both;">
		<h3>main 태그</h3>		
	</article>
	
	<article>
		<h3>기사, 논문...</h3>
	</article>
		
	<article>
		<h3>기타</h3>
	</article>

</main>

<footer>footer</footer>



</body>
</html>
