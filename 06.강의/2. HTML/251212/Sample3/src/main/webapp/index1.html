<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

<!-- input -->
text 입력: <input type="text" value="초기문자열" placeholder="이름입력"/>
<br/><br/>

숫자입력: <input type="number" value="" max="10" min="1" />
<br/><br/>

날짜입력: <input type="date" value="2025-12-25"/>
<br/><br/>

컬러: <input type="color" value="#ffff00"/>
<br/><br/>

범위: <input type="range" max="10" min="1"/>
<br/><br/>

checkbox:
<input type="checkbox" value="music"/>음악감상
<input type="checkbox" value="game"/>게임플레이
<br/><br/>

radio:
<input type="radio" name="car" value="benz" checked="checked"/>benz
<input type="radio" name="car" value="audi"/>audi
<input type="radio" name="car" value="bmw"/>bmw
<br/><br/>

select:
<select>
	<option value="apple">사과</option>
	<option value="pear">배</option>
	<option value="banana" selected="selected">바나나</option>
</select>
<br/><br/>

<textarea rows="10" cols="60" placeholder="여기에 기입해 주세요"></textarea>
<br/>

<video width="400" controls="controls">
	<source src="mov_bbb.mp4" type="video/mp4"/>
</video>




</body>
</html>
