<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
/* 1 기본 
.container{
	display: flex;
	border : 2px solid #333;
	
}*/ 

/* 2 세로방향 
.container{
	display: flex;
	flex-direction: column;
	border : 2px solid #333;
}*/

/* 3 많이 사용하는 방법 중앙정렬

.container{
	display: flex;
	border : 2px solid #333;
	height: 300px;
	
	justify-content: center;
	align-items: center;
	
}*/

/* 4 반응형 */
.container{
	display: flex;
	justify-content: center;
	align-items: center;
	
	flex-wrap: wrap;
	
}



.item{
	width: 100px;
	height: 100px;
	background-color: skyblue;
	margin: 5px;
	text-align: center;
	line-height: 100px;
	font-size: 20px;
	
}
</style>
</head>
<body>

<div class="container">
	<div class="item">1</div>
	<div class="item">2</div>
	<div class="item">3</div>
	<div class="item">4</div>
	<div class="item">5</div>
</div>
</body>
</html>
