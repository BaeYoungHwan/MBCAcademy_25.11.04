<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<style type="text/css">
*{
	background-color: rgb(0, 255, 0);	/* 0 ~ 255 */
}
p{
	color: #0000ff;
}
h3{
	color: red;
}

#job{
	background-color: #000;
}
p#job{
	color: white;
}

.cls{
	background-color: yellow;
	color: rgb(0, 0, 0);
	font-size: 24px;
}
p.cls{
	font-size: 18px;
	color: red;
}

</style>

</head>
<body>

<!-- 
	tag: 앞에 아무것도 추가하지 않아도 됩니다  p, h3,
	
	id: 현재 도큐멘트(html)에서 한개만 유효. javaScript에서 접근. CSS에서 사용, 앞에 #을 붙여준다
		#id
	class: CSS 전용. javaScript에서 접근. 앞에 .을 붙여준다
		.class
	name: 값을 전달. javaScript에서 접근.
 -->
<p>p tag 입니다</p>

<h3>h3 태그입니다</h3>

<p id="job">나는 성공한 프로그래머입니다</p> 

<h3 id="job">나는 성공한 프로그래머가 될 것입니다</h3>


<h3 class="cls">나는 문제없어</h3>

<p class="cls">나의 미래는 밝다</p>

<div class="cls">나는 부자가 될 것입니다</div>

</body>
</html>
