<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<style type="text/css">
body{
	color: green;
	text-align: center;
}

h3{
	color: rgb(255, 0, 0);
	text-decoration: overline;
}
.upper{ /* transform:변환 */
	text-transform: uppercase;
}
.lower{
	text-transform: lowercase;
}
.cap{
	text-transform: capitalize;
}
p.setif{
	font-family: "Times New Roman";
	font-style: italic;
	font-size: 1.5em;
	color: rgb(255, 255, 0);
	background-color: blue;
}

a{
	text-decoration: none;
}
a:link{
	color: #ff0000;
}
a:visited{
	color: #0000ff;
}
a:hover{
	color: rgb(0, 255, 0);
	text-decoration: underline;
	/* background-color: gray; */
}
</style>

</head>
<body>

<h3>Hello CSS</h3>

<p>have good day</p>

<p class="upper">Hello CSS upper</p>
<p class="lower">Hello CSS lower</p>
<p class="cap">Hello CSS cap</p>

<p class="setif">Welcome CSS World</p>

<a href="http://www.daum.net">환영합니다 구글입니다</a>

</body>
</html>
